<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flightline" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Fast, beautiful flight tracking" />
    <!-- iOS Splash Screen References -->
    <meta name="apple-touch-startup-image" content="/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Disable automatic phone number, address, email detection -->
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <!-- Prevent double-tap zoom entirely -->
    <meta name="touch-action" content="manipulation" />
    <title>Flightline</title>
  </head>
